spring:
  application:
    name: jackpot

  datasource:
    url: jdbc:h2:mem:jackpot;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate # schema is owned by Liquibase; JPA only verifies the mapping matches it
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  liquibase:
    change-log: classpath:liquibase/changelog-master.xml